<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="낚시꾸니 지도 탐색 화면입니다." />
    <title>지도 탐색 | 낚시꾸니</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/main.css" />
    <script src="js/map.js" defer></script>
  </head>
  <body>
    <div id="app">
      <header class="site-header">
        <div class="header-inner">
          <a class="brand" href="index.html" aria-label="낚시꾸니 지역 선택 홈">
            <img class="brand-logo" src="img/icons/03-낚시꾸니.png" alt="" />
            <span class="header-title">
              <span class="brand-name">낚시꾸니</span>
              <span class="tagline">낚시의 모든 것, 여행의 새로운 시작</span>
            </span>
          </a>

          <nav class="main-nav" aria-label="주요 메뉴">
            <a class="nav-link" href="index.html">지역 선택</a>
            <a class="nav-link active" href="map.html" aria-current="page"
              >지도 탐색</a
            >
            <a class="nav-link" href="travel.html">여행 플래너</a>
            <a class="nav-link" href="community.html">커뮤니티</a>
          </nav>

          <div class="header-actions">
            <div
              class="weather-chip"
              aria-label="떠나기 좋은 하루, 디자인 시안"
            >
              <span class="weather-icon" aria-hidden="true">☼</span>
              <span class="weather-text">떠나기 좋은 하루</span>
              <span class="weather-note">디자인 시안</span>
            </div>
            <a class="login-link" href="login.html">
              <svg
                viewBox="0 0 24 24"
                width="16"
                height="16"
                aria-hidden="true"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="8" r="3" />
                <path d="M5.5 19v-2a6.5 6.5 0 0 1 13 0v2" />
              </svg>
              로그인
            </a>
          </div>
        </div>
      </header>

      <div id="map" style="width: 100%; height: 500px"></div>
      <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=515c1a96e7a6953cfae1f5f02c972a2e"></script>
      <script>
        const map = new kakao.maps.Map(document.getElementById("map"), {
          center: new kakao.maps.LatLng(33.450701, 126.570667),
          level: 5,
        });
      </script>
      <div class="app-shell" id="map-page">
        <main class="main-stage">
          <section class="page-placeholder" aria-labelledby="map-page-title">
            <p class="page-eyebrow">MAP</p>
            <h2 id="map-page-title">지도 탐색</h2>
            <p>지도 탐색 화면을 준비 중입니다.</p>
          </section>
        </main>
      </div>
    </div>
    <button type="button" onclick="showTide()">군산 물때 조회</button>
    <pre id="tide-result"></pre>
  </body>
</html>
